<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Pokémon FireRed</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
        #game { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="game"></div>
    <script type="text/javascript">
        EJS_player = '#game';
        EJS_core = 'gba';
        // Put your RAW GitHub link to your pokemon rom right here:
        EJS_gameUrl = 'YOUR_RAW_GITHUB_POKEMON_ROM_URL';
        EJS_pathtodata = 'https://cdn.jsdelivr.net/gh/emulatorjs/emulatorjs@latest/data/';
        EJS_startOnLoaded = true;
        EJS_disableLocalStorage = false;
    </script>
    <script src="https://cdn.jsdelivr.net/gh/emulatorjs/emulatorjs@latest/data/loader.js"></script>
</body>
</html>
